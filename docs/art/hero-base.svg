<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="240" height="320">
  <title>Héros — gabarit de base (Đông Hồ simplifié)</title>
  <!-- Calques dans l'ordre de dessin. Chaque skin remplace UN calque, jamais le gabarit entier.
       Points d'ancrage : tête (60,70) r=22 · épaules y=92 · ourlet y=146 · main droite (92,122). -->
  <defs>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#1F1A17" stroke-width="0.8" opacity="0.35"/>
    </pattern>
  </defs>

  <g id="layer-shadow">
    <ellipse cx="60" cy="152" rx="30" ry="5" fill="#1F1A17" opacity="0.12"/>
  </g>

  <g id="layer-base" stroke="#1F1A17" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- jambes / pantalon (xanh chàm) -->
    <path d="M46 134 L44 150 L58 150 L60 136 L62 150 L76 150 L74 134 Z" fill="#2B4E6E"/>
    <!-- mains -->
    <circle cx="28" cy="122" r="5" fill="#F6DDBF"/>
    <circle cx="92" cy="122" r="5" fill="#F6DDBF"/>
    <!-- tête -->
    <circle cx="60" cy="70" r="22" fill="#F6DDBF"/>
    <!-- cheveux (noir laqué) -->
    <path d="M38 70 Q38 50 60 48 Q82 50 82 70 Q74 60 60 60 Q46 60 38 70 Z" fill="#1F1A17"/>
  </g>

  <g id="layer-face" fill="none" stroke="#1F1A17" stroke-width="2" stroke-linecap="round">
    <!-- yeux en arcs mi-clos, comme sur les estampes -->
    <path d="M49 73 Q53 70 57 73"/>
    <path d="M63 73 Q67 70 71 73"/>
    <path d="M56 82 Q60 85 64 82"/>
    <!-- joues vermillon -->
    <circle cx="46" cy="80" r="3.2" fill="#B23A2A" stroke="none" opacity="0.85"/>
    <circle cx="74" cy="80" r="3.2" fill="#B23A2A" stroke="none" opacity="0.85"/>
  </g>

  <g id="layer-outfit" stroke="#1F1A17" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- áo bà ba vermillon : trapèze simple, manches jusqu'aux mains -->
    <path d="M40 94 Q60 86 80 94 L94 118 L86 122 L80 110 L82 138 L38 138 L40 110 L34 122 L26 118 Z" fill="#B23A2A"/>
    <path d="M60 92 L60 138" fill="none" stroke-width="1.5"/>
    <circle cx="64" cy="104" r="1.6" fill="#D9A93A" stroke="none"/>
    <circle cx="64" cy="116" r="1.6" fill="#D9A93A" stroke="none"/>
    <circle cx="64" cy="128" r="1.6" fill="#D9A93A" stroke="none"/>
  </g>

  <g id="layer-hat" stroke="#1F1A17" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- nón lá (vàng hoè) : une seule zone texturée par personnage -->
    <path d="M22 60 L60 22 L98 60 Q60 68 22 60 Z" fill="#D9A93A"/>
    <path d="M22 60 L60 22 L98 60 Q60 68 22 60 Z" fill="url(#hatch)" stroke="none"/>
    <path d="M40 58 Q60 54 80 58" fill="none" stroke-width="1.2"/>
  </g>

  <g id="layer-accessory">
    <!-- vide dans le gabarit : quạt (éventail), lồng đèn (lanterne)… ancrés sur la main droite (92,122) -->
  </g>
</svg>
