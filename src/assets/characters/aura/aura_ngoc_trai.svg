<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <g id="layer-aura" stroke="#1F1A17" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Perles flottantes : deux arcs de perles d’écume, chacune dans son halo de jade, la perle du dragon au sommet dans sa flamme -->
    <!-- flamme vermillon de la perle du dragon -->
    <path d="M60 1 Q62.5 6 66.5 5 Q66 10 70 12.5 Q70.5 23 60 28.5 Q49.5 23 50 12.5 Q54 10 53.5 5 Q57.5 6 60 1 Z" fill="#B23A2A" stroke-width="2"/>
    <!-- grandes perles, halos de jade -->
    <g fill="#9CC3BB" stroke-width="2">
      <circle cx="33" cy="37" r="8.5"/>
      <circle cx="87" cy="37" r="8.5"/>
      <circle cx="16" cy="62" r="7.5"/>
      <circle cx="104" cy="62" r="7.5"/>
      <circle cx="10" cy="92" r="8"/>
      <circle cx="110" cy="92" r="8"/>
      <circle cx="14" cy="123" r="7"/>
      <circle cx="106" cy="123" r="7"/>
    </g>
    <g fill="#F4E4C4" stroke-width="1.5">
      <circle cx="60" cy="17" r="6"/>
      <circle cx="33" cy="37" r="4.8"/>
      <circle cx="87" cy="37" r="4.8"/>
      <circle cx="16" cy="62" r="4.1"/>
      <circle cx="104" cy="62" r="4.1"/>
      <circle cx="10" cy="92" r="4.5"/>
      <circle cx="110" cy="92" r="4.5"/>
      <circle cx="14" cy="123" r="3.8"/>
      <circle cx="106" cy="123" r="3.8"/>
    </g>
    <!-- second arc de petites perles, plus près du héros -->
