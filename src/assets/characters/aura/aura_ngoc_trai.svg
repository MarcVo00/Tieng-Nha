      <circle cx="45" cy="24" r="4"/>
      <circle cx="75" cy="24" r="4"/>
      <circle cx="24" cy="49" r="3.6"/>
      <circle cx="96" cy="49" r="3.6"/>
      <circle cx="18" cy="77" r="3.6"/>
      <circle cx="102" cy="77" r="3.6"/>
      <circle cx="20" cy="107" r="3.4"/>
      <circle cx="100" cy="107" r="3.4"/>
    </g>
    <g fill="#F4E4C4" stroke-width="1.1">
      <circle cx="45" cy="24" r="2"/>
      <circle cx="75" cy="24" r="2"/>
      <circle cx="24" cy="49" r="1.8"/>
      <circle cx="96" cy="49" r="1.8"/>
      <circle cx="18" cy="77" r="1.8"/>
      <circle cx="102" cy="77" r="1.8"/>
      <circle cx="20" cy="107" r="1.7"/>
