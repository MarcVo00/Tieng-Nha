      <use href="#base-fox-tail2" transform="matrix(-1 0 0 1 120 0)"/>
      <g id="base-fox-tail3"><use href="#base-tail3" stroke-width="12"/><use href="#base-tail3" stroke-width="20" stroke-dasharray="58 100" stroke-dashoffset="-38"/><use href="#base-tail3" stroke="#2B4E6E" stroke-width="7"/><use href="#base-tail3" stroke="#2B4E6E" stroke-width="15" stroke-dasharray="57 100" stroke-dashoffset="-38"/><use href="#base-tail3" stroke-width="18" stroke-dasharray="5 100" stroke-dashoffset="-95"/><use href="#base-tail3" stroke="#F4E4C4" stroke-width="13" stroke-dasharray="5 100" stroke-dashoffset="-95"/></g>
