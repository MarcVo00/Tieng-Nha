<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <g id="layer-hat" stroke="#1F1A17" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Masque de renard : masque de renard crème relevé sur le front, peint de vermillon, noué d'un cordon vermillon, feux de renard aux oreilles -->
    <!-- cordon vermillon autour de la tête, glands à la tempe -->
    <path d="M38.5 64 Q60 54 81.5 64" fill="none" stroke-width="5.2"/>
    <path d="M38.5 64 Q60 54 81.5 64" fill="none" stroke="#B23A2A" stroke-width="2.6"/>
    <path d="M81 64 L86 78 M81 64 L82 80" fill="none" stroke="#B23A2A" stroke-width="2.2"/>
    <g transform="rotate(-7 60 40)">
      <!-- feux de renard bleus au bout des oreilles -->
      <path d="M36 14 Q33 8 37 2 Q37.5 7 40.5 6 Q41 10 39 14 Z M84 14 Q87 8 83 2 Q82.5 7 79.5 6 Q79 10 81 14 Z" fill="#9CC3BB" stroke-width="2"/>
      <!-- le masque -->
      <path d="M40 46 Q37 30 38 13 Q48 18 53 28 Q60 26 67 28 Q72 18 82 13 Q83 30 80 46 Q75 56 64 61 Q60 63 56 61 Q45 56 40 46 Z" fill="#F4E4C4"/>
      <!-- intérieur des oreilles -->
      <path d="M41.5 19 Q47 22 49.5 28 L43 33 Z M78.5 19 Q73 22 70.5 28 L77 33 Z" fill="#1F1A17" stroke-width="1.5"/>
      <!-- flammes vermillon peintes au-dessus des yeux -->
      <path d="M44 38 Q49 31 55 35 Q50 34.5 47 39 Z M76 38 Q71 31 65 35 Q70 34.5 73 39 Z" fill="#B23A2A" stroke-width="1.3"/>
      <!-- yeux fendus -->
      <path d="M45.5 43 Q50 39.5 55 42.5 Q50 44.5 45.5 43 Z M74.5 43 Q70 39.5 65 42.5 Q70 44.5 74.5 43 Z" fill="#1F1A17" stroke-width="1.3"/>
      <!-- moustaches vermillon et truffe noire -->
      <path d="M44 50 L52 51.5 M45.5 54 L53 53.5 M76 50 L68 51.5 M74.5 54 L67 53.5" fill="none" stroke="#B23A2A" stroke-width="1.7"/>
      <ellipse cx="60" cy="57.5" rx="3" ry="2.2" fill="#1F1A17" stroke="none"/>
      <!-- joyau d'or au front -->
      <path d="M60 29 L62.6 33 L60 37 L57.4 33 Z" fill="#D9A93A" stroke-width="1.4"/>
    </g>
  </g>
</svg>
