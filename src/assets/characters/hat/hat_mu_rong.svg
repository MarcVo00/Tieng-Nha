    <path d="M36 67 Q60 56 84 67 L83.5 60 Q60 50 36.5 60 Z" fill="#D9A93A"/>
    <path d="M51 55 Q60 49 69 55 L68 63 Q60 67 52 63 Z" fill="#9CC3BB"/>
    <circle cx="56.5" cy="58" r="1.1" fill="#1F1A17" stroke="none"/>
    <circle cx="63.5" cy="58" r="1.1" fill="#1F1A17" stroke="none"/>
    <!-- crocs d’écume -->
    <path d="M53.5 63.5 L55 68.5 L57 64.6 Z M66.5 63.5 L65 68.5 L63 64.6 Z" fill="#F4E4C4" stroke-width="1.5"/>
  </g>
</svg>
