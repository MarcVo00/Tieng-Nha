    <path d="M38 58 Q26 62 21 80 Q27 76 29 82 Q32 70 39 66 Z M82 58 Q94 62 99 80 Q93 76 91 82 Q88 70 81 66 Z" fill="#B23A2A"/>
    <!-- crâne -->
    <path d="M36.5 64 Q33 36 60 32 Q87 36 83.5 64 Z" fill="#4E7A4A"/>
    <!-- arcades froncées et yeux d’or à pupille fendue -->
    <path d="M41 47 L55 50 M79 47 L65 50" fill="none" stroke-width="3"/>
    <path d="M43 52 Q48 48.5 53 52 Q48 55.5 43 52 Z M77 52 Q72 48.5 67 52 Q72 55.5 77 52 Z" fill="#D9A93A" stroke-width="1.6"/>
    <path d="M48 49.5 L48 54.5 M72 49.5 L72 54.5" fill="none" stroke-width="1.6"/>
