    <!-- bois d’or -->
    <path d="M45 43 Q36 31 27 16 Q33 18 37 23 Q35 14 38 7 Q43 17 43 25 Q47 34 54 39 Z M75 43 Q84 31 93 16 Q87 18 83 23 Q85 14 82 7 Q77 17 77 25 Q73 34 66 39 Z" fill="#D9A93A"/>
