<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160">
  <defs>
    <path id="hat-bell" d="M-3.4 2.2 Q-3.6 -3.6 0 -4 Q3.6 -3.6 3.4 2.2 Z M0 2.2 L0 3.8"/>
  </defs>
  <g id="layer-hat" stroke="#1F1A17" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Coiffe aux clochettes : bonnet indigo du maître des rites, pompon vermillon, bandeau d'or, clochettes d'or aux tempes -->
    <!-- cordons vermillon qui pendent aux tempes -->
    <path d="M38.5 64 L35 88 M81.5 64 L85 88" fill="none" stroke="#B23A2A" stroke-width="2.2"/>
    <!-- pompon vermillon -->
    <circle cx="60" cy="27" r="6" fill="#B23A2A"/>
    <!-- bonnet indigo -->
    <path d="M36 62 Q33 33 60 31 Q87 33 84 62 Z" fill="#2B4E6E"/>
    <path d="M60 33 L60 52 M47 36 Q44 44 44 54 M73 36 Q76 44 76 54" fill="none" stroke-width="1.3"/>
    <!-- bandeau d'or -->
    <path d="M36 67 Q60 55 84 67 L83.5 58.5 Q60 48 36.5 58.5 Z" fill="#D9A93A"/>
    <!-- clochettes d'or -->
    <g fill="#D9A93A" stroke-width="1.4">
      <use href="#hat-bell" transform="translate(36.6 76)"/>
      <use href="#hat-bell" transform="translate(35 89)"/>
      <use href="#hat-bell" transform="translate(83.4 76)"/>
      <use href="#hat-bell" transform="translate(85 89)"/>
      <use href="#hat-bell" transform="translate(48 47)"/>
      <use href="#hat-bell" transform="translate(60 44)"/>
      <use href="#hat-bell" transform="translate(72 47)"/>
    </g>
  </g>
</svg>
