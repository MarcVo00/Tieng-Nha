    <path d="M22 60 L60 22 L98 60 Q60 68 22 60 Z" fill="#D9A93A"/>
    <path d="M22 60 L60 22 L98 60 Q60 68 22 60 Z" fill="url(#hat-hatch)" stroke="none"/>
