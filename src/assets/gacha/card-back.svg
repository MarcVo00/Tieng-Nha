      <path d="M75 76 Q63 74 60 60 Q71 61 75 76 Z" fill="#D9A93A" stroke-width="2"/>
      <path d="M75 76 Q87 74 90 60 Q79 61 75 76 Z" fill="#D9A93A" stroke-width="2"/>
      <path d="M75 47 Q84 60 75 76 Q66 60 75 47 Z" fill="#B23A2A" stroke-width="2"/>
