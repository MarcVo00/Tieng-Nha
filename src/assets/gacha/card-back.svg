      <path d="M19 30 Q19 21 27 21 Q33 21 33 27 Q33 31 29 31 Q26 31 26 28"/>
      <path d="M131 30 Q131 21 123 21 Q117 21 117 27 Q117 31 121 31 Q124 31 124 28"/>
