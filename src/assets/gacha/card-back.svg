    <rect x="9" y="9" width="132" height="126" rx="7" fill="none" stroke="#D9A93A" stroke-width="2"/>
    <rect x="13" y="13" width="124" height="118" rx="5" fill="none" stroke-width="1" opacity="0.6"/>
