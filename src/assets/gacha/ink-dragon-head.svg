<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 34">
  <!-- La tête du dragon d'encre, gueule ouverte (il rugit), tournée vers la droite ; le cou à gauche (2,20) -->
  <g stroke="#1F1A17" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <!-- crinière de flammes vermillon -->
    <path d="M9 21 L1 15 L7 15 L2 7 L10 11 L9 3 L15 9 L18 4 L19 12 Z" fill="#B23A2A"/>
    <!-- bois de cerf, crème -->
    <path d="M18 9 Q14 2 6 1.5 Q12 4 14 10 Z M23 8 Q22 3 17 1 Q20 4 20 9 Z" fill="#F4E4C4" stroke-width="1.4"/>
    <!-- mâchoire inférieure, ouverte -->
    <path d="M14 22 Q24 22 34 25 L41 26 Q44 27 42 29 L32 30 Q20 31 5 26 Z" fill="#1F1A17"/>
    <!-- la gueule -->
    <path d="M20 20 L43 15 L40 25 Q30 22 20 21 Z" fill="#B23A2A" stroke-width="1.4"/>
    <!-- crâne et museau -->
    <path d="M2 22 Q2 11 15 8.5 Q24 5.5 31 9.5 L42 10 Q47 10.5 46.5 13.5 L45 16 L31 17 Q25 19 19 21 Z" fill="#1F1A17"/>
    <!-- crocs -->
    <path d="M33 16.8 L34.6 19.8 L36 16.5 Z M38.5 16.2 L39.6 18.8 L40.8 16 Z M35 24.4 L36.4 21.8 L37.6 24.8 Z" fill="#F4E4C4" stroke-width="1"/>
    <!-- œil d'or, sourcil levé -->
    <circle cx="24" cy="12.4" r="2.8" fill="#D9A93A" stroke-width="1.2"/>
    <path d="M24 10.8 L24 14" fill="none" stroke-width="1.4"/>
    <path d="M19.5 9.2 Q24 7 29 9.6" fill="none" stroke="#B23A2A" stroke-width="1.4"/>
    <!-- naseau, moustaches d'or -->
    <circle cx="42.5" cy="12" r="0.9" fill="#F4E4C4" stroke="none"/>
    <path d="M44 11 Q40 3 47 1.5 M40 28 Q35 33.5 44 33" fill="none" stroke="#D9A93A" stroke-width="1.4"/>
  </g>
</svg>
