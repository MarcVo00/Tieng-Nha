<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 76">
  <g id="lantern" stroke="#1F1A17" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- lồng đèn : lanterne de papier rouge, coiffes d'or, gland. La lumière est un calque à part (le présage épique) -->
    <path d="M24 0 L24 10" fill="none" stroke-width="2"/>
    <rect x="15" y="10" width="18" height="6" rx="2" fill="#D9A93A"/>
    <ellipse cx="24" cy="38" rx="19" ry="22" fill="#B23A2A"/>
    <!-- côtes de bambou et bandes d'or -->
    <path d="M24 16 L24 60 M14.5 19 Q8 38 14.5 57 M33.5 19 Q40 38 33.5 57" fill="none" stroke-width="1.4"/>
    <path d="M6.5 30 Q24 35 41.5 30 M6.5 46 Q24 51 41.5 46" fill="none" stroke="#D9A93A" stroke-width="1.8"/>
    <!-- caractère porte-bonheur, simple trait d'encre -->
    <path d="M20 36 L28 36 M24 33 L24 42 M20.5 40 L27.5 40" fill="none" stroke-width="1.4"/>
    <rect x="15" y="58" width="18" height="6" rx="2" fill="#D9A93A"/>
    <path d="M24 64 L24 75 M20 65 L18 74 M28 65 L30 74" fill="none" stroke="#B23A2A" stroke-width="2"/>
  </g>
</svg>
