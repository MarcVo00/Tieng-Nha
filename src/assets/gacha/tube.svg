<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 140">
  <g id="tube" stroke="#1F1A17" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- ống xăm : tube de bambou laqué vermillon, plein de bâtonnets. Pivot de la secousse : (40,134) -->
    <!-- intérieur sombre de l'ouverture -->
    <ellipse cx="40" cy="44" rx="24" ry="6" fill="#1F1A17"/>
    <!-- bâtonnets serrés, bouts de bois nu : la rareté reste secrète -->
    <g fill="#F4E4C4" stroke-width="1.8">
      <rect x="20" y="17" width="6" height="34" rx="1.5" transform="rotate(-7 23 50)"/>
      <rect x="26" y="10" width="6" height="42" rx="1.5" transform="rotate(-4 29 50)"/>
      <rect x="44" y="8" width="6" height="44" rx="1.5" transform="rotate(3 47 50)"/>
      <rect x="50" y="15" width="6" height="36" rx="1.5" transform="rotate(6 53 50)"/>
      <rect x="32" y="4" width="6" height="48" rx="1.5" transform="rotate(-1 35 50)"/>
      <rect x="38" y="12" width="6" height="40" rx="1.5" transform="rotate(1 41 50)"/>
    </g>
    <!-- corps du tube -->
    <path d="M16 44 Q40 51 64 44 L62 130 Q62 136 56 136 L24 136 Q18 136 18 130 Z" fill="#B23A2A"/>
    <!-- bague d'or à l'ouverture, pied noir -->
    <path d="M16 44 Q40 51 64 44 L63.8 51 Q40 58 16.2 51 Z" fill="#D9A93A"/>
    <path d="M18.3 126 Q40 132 61.7 126 L62 130 Q62 136 56 136 L24 136 Q18 136 18 130 Z" fill="#1F1A17"/>
    <!-- nœud du bambou -->
    <path d="M17.3 86 Q40 92 62.7 86" fill="none" stroke-width="1.6"/>
    <!-- nuage d'or peint sur la laque -->
    <path d="M29 112 Q26 112 26 108.5 Q26 105 30 105.5 Q31 100.5 36.5 101.5 Q39.5 97.5 44.5 100.5 Q49.5 99 50.5 104.5 Q55 104.5 54.5 108.5 Q54 112 50.5 112 Z" fill="#D9A93A" stroke-width="1.6"/>
    <path d="M33 108.5 Q33 105.5 36 106 Q38.5 107 37 109 M44 108 Q44.5 105 47 105.5" fill="none" stroke-width="1.2"/>
    <path d="M27 66 Q40 70 53 66 M27 72 Q40 76 53 72" fill="none" stroke="#D9A93A" stroke-width="1.6"/>
  </g>
</svg>
